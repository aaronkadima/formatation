name: Verificação

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  site:
    name: Site compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  banco:
    name: Regras de acesso do banco
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Simula o Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f tests/supabase_stub.sql
      - name: Aplica o schema
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Reaplica o schema (deve ser idempotente)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Testa as regras de acesso
        run: python3 tests/rls_test.py
